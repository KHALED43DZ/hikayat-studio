<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d34">
<link rel="manifest" href="manifest.json">
<title>استوديو الحكايات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#12221d;--mut:#5d6f68;--line:#d5ddd8;--g:#0f3d34;--g2:#1c6b58;--r:#c0392b;--ok:#1e8a5a}
@media(prefers-color-scheme:dark){:root{--bg:#0d1714;--card:#15241f;--ink:#e8f0ec;--mut:#93a89f;--line:#26392f;--g:#2fa384;--g2:#3cc7a2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#0f3d34;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:19px;font-weight:800}
#ver{font-size:12px;font-weight:400;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;direction:ltr}
#gear{background:rgba(255,255,255,.14);padding:0;width:44px;font-size:20px}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:16px}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mut)}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--g);color:#fff;cursor:pointer;min-height:44px}
button:disabled{opacity:.5}
button.alt{background:transparent;color:var(--g2);border:1px solid var(--g2)}
button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.mut{color:var(--mut)}.small{font-size:12px}
.keys{list-style:none;padding:0;margin:8px 0;font-size:13px}
.keys li{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);direction:ltr}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chars button{text-align:right;display:flex;flex-direction:column;gap:2px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.chars b{color:var(--g2)}
.chars button.done{background:var(--ok);color:#fff}
.ep{border-top:1px solid var(--line);padding:12px 0}
.ep textarea{margin:6px 0}
.scene{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.num{font-weight:800;font-size:20px;color:var(--r);text-align:center}
.ref{grid-column:2/4;font-size:12px;color:var(--mut)}
details{grid-column:1/4;font-size:13px;color:var(--mut)}
details p,.en{margin:6px 0;line-height:1.7;direction:ltr;text-align:left}
.sum{grid-column:1/4;font-size:13px}
#status{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:12px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;display:none;z-index:9}
#status.on{display:block}#status.err{background:var(--r);color:#fff}#status.busy::before{content:"⏳ "}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
#install{display:none;background:var(--g);color:#fff;border-radius:10px;padding:12px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
#install.on{display:flex}#install button{background:#fff;color:#0f3d34;padding:8px 14px;min-height:40px}#install .x{background:transparent;color:#fff}
.hide{display:none}
</style>
</head>
<body>
<header><div class="bar"><div class="brand" id="brand">استوديو الحكايات <span id="ver"></span></div><button id="gear" aria-label="الإعدادات">⚙️</button></div></header>
<main>
<div id="install"><span id="installMsg">ثبّت التطبيق على جهازك لتفتحه كأي تطبيق.</span><span><button id="installBtn">تثبيت</button><button class="x" id="installX" aria-label="إغلاق">✕</button></span></div>

<section id="v-home">
 <div class="card">
  <h2>معلومات عامة عن المسلسل</h2>
  <p class="mut small">اكتب ما تعرفه فقط، والباقي يبتكره التطبيق.</p>
  <label>اسم المسلسل (اختياري)</label><input id="f_name">
  <label>الفكرة العامة</label><textarea id="f_idea" rows="3" placeholder="مثال: أطفال يبحثون عن كنز في قرية جبلية"></textarea>
  <label>الفئة العمرية</label><select id="f_age"><option>3-5 سنوات</option><option selected>6-9 سنوات</option><option>10-14 سنة</option><option>العائلة كلها</option></select>
  <label>النوع</label><select id="f_genre"><option>مغامرة</option><option>كوميديا</option><option>تراث وحكايات شعبية</option><option>تشويق وألغاز</option><option>قيم وأخلاق</option></select>
  <label>البيئة الجزائرية</label><input id="f_place" placeholder="قرية جبلية، صحراء، مدينة قديمة...">
  <label>أبعاد الفيديو</label><select id="f_ratio"><option value="16:9">16:9 أفقي (يوتيوب)</option><option value="9:16">9:16 عمودي (ريلز وتيك توك)</option><option value="1:1">1:1 مربع</option></select>
  <label>ستايل الفيديو</label><select id="f_style"><option value="3D animated cartoon, soft cinematic lighting">كرتون ثلاثي الأبعاد</option><option value="2D hand-drawn animation, bold colors">كرتون ثنائي الأبعاد</option><option value="watercolor storybook illustration, soft textures">رسم مائي لكتاب حكايات</option><option value="photorealistic cinematic live-action look">واقعي سينمائي</option><option value="claymation stop-motion look">صلصال (ستوب موشن)</option><option value="anime style, expressive and colorful">أنمي</option><option value="traditional Algerian art style with zellige patterns and warm earthy tones">فن تراثي جزائري بزخارف الزليج</option></select>
  <input id="f_style2" placeholder="أو اكتب ستايلاً خاصاً (اختياري)" style="margin-top:8px">
  <label>عدد الحلقات</label><input id="f_eps" type="number" min="1" max="20" value="5">
  <label>القيم المراد إيصالها</label><input id="f_values" placeholder="الصدق، التعاون...">
  <label>ملاحظات أو شخصيات تريدها</label><textarea id="f_notes" rows="2"></textarea>
  <button data-act="mk" style="width:100%;margin-top:14px">أنشئ المسلسل</button>
 </div>
</section>
<section id="v-series" class="hide"></section>
<section id="v-ep" class="hide"></section>
<section id="v-set" class="hide"></section>
<input type="file" id="impf" accept=".json" class="hide">
</main>
<div id="status"></div><div class="toast" id="toast"></div>

<script>
const APP_VERSION='1.3.1'; /* غيّره عند كل تحديث */
const $=id=>document.getElementById(id);
$('ver').textContent='v'+APP_VERSION;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let S=Object.assign({keys:'',model:'gemini-3.8-flash',modelCustom:'',fallback:'gemini-3.5-flash-lite',fbCustom:'',think:'low',darija:'full',dialogue:'clip',refs:'image',scenes:12,secs:10},store.get('settings',{}));
let P=store.get('project',null),cool=store.get('cool2',{}),cur='home',prev='home',curEp=null,busyF=false,rot=0;
const save=()=>store.set('project',P);
const norm=m=>(m||'').trim().toLowerCase().replace(/^models\//,'').replace(/\s+/g,'-');
const MODELS=[
 {id:'gemini-3.8-flash',sp:1,free:1,note:'الأذكى بين نماذج Flash، وهو الافتراضي المقترح'},
 {id:'gemini-3.5-flash-lite',sp:2,free:1,note:'الأسرع، وقد تكون الدارجة أضعف قليلاً'},
 {id:'gemini-3.1-flash-lite',sp:1,free:1,note:'سريع واقتصادي'},
 {id:'gemini-3.1-pro-preview',sp:0,free:1,note:'أقوى وأبطأ، للجودة القصوى'},
 {id:'gemini-3.6-flash',sp:1,free:0,note:'الجيل السابق من Flash'},
 {id:'gemini-3-flash-preview',sp:1,free:0,note:'قديم'},
 {id:'gemini-4-argon',sp:0,free:0,note:'للمسائل المعقدة، بطيء'},
 {id:'gemini-4-carbon',sp:0,free:0,note:'الأحدث والأقوى، وهو الأبطأ'}];
for(const [k,c] of [['model','modelCustom'],['fallback','fbCustom']]){S[k]=norm(S[k]);if(S[k]==='gemini-3.7-flash')S[k]='gemini-3.5-flash-lite';if(S[k]!=='__custom'&&!MODELS.some(m=>m.id===S[k])){S[c]=S[k];S[k]='__custom'}}
const pick=(k,c)=>S[k]==='__custom'?norm(S[c]):S[k];
const mlabel=m=>`${m.id} · ${m.sp===2?'⚡⚡ الأسرع':m.sp===1?'⚡ سريع':'🐢 بطيء'} · ${m.free?'🆓 مجاني':'💳 مدفوع'}`;
const modelOpts=k=>MODELS.map(m=>`<option value="${m.id}"${S[k]===m.id?' selected':''}>${mlabel(m)}</option>`).join('')+`<option value="__custom"${S[k]==='__custom'?' selected':''}>آخر (أكتبه)</option>`;
const mnote=k=>{const m=MODELS.find(x=>x.id===S[k]);return m?m.note+(m.free?'':' ⚠️ يحتاج حساباً مدفوعاً'):'اكتب معرّف النموذج مثل gemini-3.8-flash'};
const pre=()=>{const r=P?.form?.ratio,g=P?.bible?.style_guide;return(r?`${r} ${r==='9:16'?'vertical':r==='1:1'?'square':'horizontal'} frame. `:'')+(g?g+'. ':'')};
const heroPrompt=b=>{const m=b.main||[],n=m.length;
 return `Character reference sheet on a pure white background, horizontal layout. ${n} character${n>1?'s':''} in a single row, each shown full body from head to toe, front view, neutral standing pose, drawn in the same art style (${b.style_guide||'consistent style'}). Thin vertical divider lines separate each character from the next. Below each character, a caption with the character's name in clean readable Arabic text: ${m.map((c,i)=>`${i+1}) "${c.name}"`).join(', ')}. `+m.map((c,i)=>`Character ${i+1} (${c.name}): ${c.desc}.`).join(' ')};

/* ---------- تثبيت التطبيق ---------- */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let dp=null;
if(!standalone&&!localStorage.getItem('installDismissed')){
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').classList.add('on')});
 if(/iphone|ipad|ipod/i.test(navigator.userAgent)){$('installMsg').textContent='للتثبيت: زر المشاركة في Safari ثم «إضافة إلى الشاشة الرئيسية».';$('installBtn').style.display='none';$('install').classList.add('on')}
}
$('installBtn').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('install').classList.remove('on')};
$('installX').onclick=()=>{$('install').classList.remove('on');localStorage.setItem('installDismissed','1')};

/* ---------- واجهة عامة ---------- */
function say(m,t){const s=$('status');s.textContent=m;s.className=m?'on '+(t||''):'';if(t==='ok')setTimeout(()=>{if(s.textContent===m)s.className=''},4000)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1300)}
function lock(b){busyF=b;document.querySelectorAll('button[data-act]').forEach(x=>x.disabled=b)}
function show(v){cur=v;['home','series','ep','set'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==v));
 if(v==='series')renderSeries();if(v==='ep')renderEp();if(v==='set')renderSet();scrollTo(0,0)}
$('brand').onclick=()=>show(P?'series':'home');
$('gear').onclick=()=>{if(cur!=='set')prev=cur;show('set')};

/* ---------- مجمّع المفاتيح ---------- */
const mdl=()=>S.model.trim().toLowerCase().replace(/^models\//,'').replace(/\s+/g,'-');
const keyArr=()=>S.keys.split('\n').map(k=>k.trim()).filter(Boolean);
const mask=k=>k.length>10?k.slice(0,5)+'••••'+k.slice(-4):'••••';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gem(system,user){
 const ks=keyArr();
 if(!ks.length)throw new Error('أضف مفتاح Gemini واحداً على الأقل من الإعدادات ⚙️');
 let think=S.think!=='default',last='';
 const mk=()=>JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:Object.assign({responseMimeType:'application/json'},think?{thinkingConfig:{thinkingLevel:'low'}}:{})});
 for(let round=0;round<4;round++){
  const now=Date.now(),ready=ks.filter(k=>(cool[k]||0)<=now);
  if(!ready.length)throw new Error(last||'كل المفاتيح في فترة راحة. انتظر دقيقة أو أضف مفتاحاً.');
  const main=pick('model','modelCustom'),alt=pick('fallback','fbCustom'),fb=round>=2&&alt&&alt!==main,model=fb?alt:main;
  let over=false;
  for(let i=0;i<ready.length;i++){
   const k=ready[(rot+i)%ready.length],base=`${model} · مفتاح ${ks.indexOf(k)+1} من ${ks.length}`,t0=Date.now();
   const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),75000);
   const iv=setInterval(()=>say(`جارٍ الكتابة بـ ${base} — ${Math.round((Date.now()-t0)/1000)} ث`,'busy'),1000);
   say(`جارٍ الاتصال بـ ${base}`,'busy');
   try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:mk(),signal:ac.signal});
    if(r.ok){const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');rot++;if(t)return t;last='رد فارغ: '+(j.promptFeedback?.blockReason||j.candidates?.[0]?.finishReason||'');continue}
    const e=(await r.text()).slice(0,220);last=`خطأ ${r.status}: ${e}`;
    if(think&&r.status===400&&/think/i.test(e)){think=false;i--;continue}
    if(r.status===503){over=true;continue}
    if(r.status===404&&fb)continue;
    if(r.status===429){cool[k]=Date.now()+60000;store.set('cool2',cool);continue}
    if(r.status===403||/API key not valid|API_KEY_INVALID/.test(e)){cool[k]=Date.now()+3600000;store.set('cool2',cool);continue}
    const f=new Error(last+(r.status===404||/model/i.test(e)?'\nتحقق من اسم النموذج في الإعدادات.':''));f.fatal=1;throw f;
   }catch(e){if(e.fatal)throw e;last=e.name==='AbortError'?'انتهت مهلة الطلب (75 ثانية).':e.message;over=true}
   finally{clearTimeout(tm);clearInterval(iv)}
  }
  if(round<3&&over){const w=8*(round+1);for(let t=w;t>0;t--){say(`الخادم مشغول. إعادة المحاولة بعد ${t} ثانية (${round+2} من 4)${round>=1&&alt&&alt!==main?' بالنموذج الاحتياطي':''}`,'busy');await sleep(1000)}}
 }
 throw new Error(last+'\nالخادم مشغول، جرّب بعد قليل أو غيّر النموذج من الإعدادات.');
}
function parse(t){t=t.replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');try{return JSON.parse(t.slice(a,b+1))}catch{throw new Error('رد Gemini ليس JSON صالحاً (ربما انقطع لطوله). أعد المحاولة.')}}

/* ---------- البرومبتات ---------- */
const bibleSys=f=>`أنت كاتب ومخرج لمسلسلات جزائرية قصيرة تُنتج كفيديوهات. من المعلومات العامة التي يقدمها المستخدم ابتكر مسلسلاً أصلياً (لا تقتبس عملاً موجوداً) فيه تراث جزائري حقيقي، ومحتواه آمن ومناسب للفئة العمرية. أخرج JSON فقط بلا شرح ولا Markdown.
- main: 2-4 شخصيات رئيسية، لكل منها name بالعربية وdesc بالإنجليزية وصف بصري ثابت (العمر، الملامح، الشعر، اللباس بألوان محددة).
- secondary: 4-8 شخصيات وأماكن ثانوية متكررة، لكل منها code حرفي (A,B,C...) وtype (character|place|object) وname عربي وprompt إنجليزي لصورة مرجعية.
- style_guide: جملة إنجليزية واحدة للأسلوب البصري الموحد، مبنية على الستايل المطلوب (${f.style}) ومناسبة لكادر ${f.ratio}، ولا نصوص مكتوبة داخل الصور.
- episodes: بالضبط ${f.eps} حلقة، لكل منها n وtitle وvalue (القيمة التربوية) وsummary عربي من 3-4 جمل. تتصاعد الأحداث وتنتهي بخاتمة مرضية.
{"title":"","logline":"","style_guide":"","main":[{"name":"","desc":""}],"secondary":[{"code":"A","type":"","name":"","prompt":""}],"episodes":[{"n":1,"title":"","value":"","summary":""}]}`;

const epSys=()=>`أنت مخرج فيديو. حوّل ملخص الحلقة إلى ${S.scenes} مشهداً بالضبط، مدة كل مشهد ${S.secs} ثوانٍ، وحافظ على اتساق القصة مع الحلقات السابقة. أخرج JSON فقط بلا شرح.
- الحوار بالدارجة الجزائرية ${S.darija==='full'?'الكاملة':'القريبة من الفصحى'}، مكتوباً بالحروف العربية.
- first_frame_prompt: إنجليزي سينمائي للصورة الأولى (الكادر، الإضاءة، الحالة). انسخ الوصف الثابت للشخصيات الرئيسية الظاهرة حرفياً من الدليل. لا نصوص داخل الصورة.
- motion_prompt: إنجليزي، حركة الكاميرا والشخصيات خلال ${S.secs} ثوانٍ. ${S.dialogue==='clip'?'ضمّن حواراً منطوقاً قصيراً بين علامتي تنصيص مع اسم المتكلم يناسب المدة.':'لا تضمّن حواراً منطوقاً، واكتب تعليقاً صوتياً قصيراً في الحقل voice.'}
- ${S.refs==='image'?'للعناصر الثانوية اكتب في البرومبت (refer to image X) بدل إعادة وصفها.':'كرر وصف العناصر الثانوية كاملاً داخل البرومبت ولا تستخدم الرموز في النص.'}
- التكوين مناسب لكادر ${P?.form?.ratio||'16:9'}.
- refs: رموز الثانويات الظاهرة. أول مشهد يجذب الانتباه، وآخره يمهد للحلقة التالية (أو يختم المسلسل إن كانت الأخيرة).
{"title":"","scenes":[{"n":1,"summary":"سطر عربي","first_frame_prompt":"","motion_prompt":"","voice":"","refs":["A"]}]}`;

/* ---------- إنشاء الدليل والحلقات ---------- */
async function makeBible(f){
 if(!f){f={name:$('f_name').value,idea:$('f_idea').value,age:$('f_age').value,genre:$('f_genre').value,place:$('f_place').value,eps:Math.min(20,Math.max(1,+$('f_eps').value||5)),ratio:$('f_ratio').value,style:$('f_style2').value.trim()||$('f_style').value,values:$('f_values').value,notes:$('f_notes').value};
  if(!f.idea.trim()&&!f.name.trim())return say('اكتب فكرة عامة أو اسماً على الأقل.','err')}
 if(P&&!confirm('سيُستبدل المشروع الحالي. متابعة؟'))return;
 lock(true);
 try{
  const b=parse(await gem(bibleSys(f),`المعلومات العامة:\n${JSON.stringify(f,null,1)}`));
  if(!Array.isArray(b.episodes)||!b.episodes.length)throw new Error('الدليل ناقص. أعد المحاولة.');
  P={form:f,bible:b,eps:{},copied:{}};save();show('series');say('تم إنشاء الدليل. راجعه ثم اختر حلقة.','ok');
 }catch(e){say(e.message,'err')}
 lock(false);
}
async function makeEp(n){
 if(P.eps[n]&&!confirm('ستُستبدل الحلقة الحالية. متابعة؟'))return;
 const b=P.bible,ep=b.episodes.find(e=>e.n===n);
 const prevS=b.episodes.filter(e=>e.n<n).map(e=>`${e.n}. ${e.title}: ${e.summary}`).join('\n')||'لا يوجد';
 lock(true);
 try{
  const r=parse(await gem(epSys(),`الدليل:\n${JSON.stringify({style_guide:b.style_guide,main:b.main,secondary:b.secondary})}\n\nالحلقات السابقة:\n${prevS}\n\nالحلقة المطلوبة:\n${JSON.stringify(ep)}`));
  if(!Array.isArray(r.scenes)||!r.scenes.length)throw new Error('لم يُرجع Gemini مشاهد. أعد المحاولة.');
  P.eps[n]=r;Object.keys(P.copied).filter(k=>k.startsWith(n+':')).forEach(k=>delete P.copied[k]);
  save();curEp=n;show('ep');say(`تم: ${r.scenes.length} مشهداً`,'ok');
 }catch(e){say(e.message,'err')}
 lock(false);
}

/* ---------- العرض ---------- */
const cp=id=>P.copied[id]?' done':'';
function renderSeries(){
 const b=P.bible,sg=pre();
 $('v-series').innerHTML=`<div class="card"><h2>${esc(b.title)}</h2><p class="mut">${esc(b.logline)}</p><p class="mut small">الأبعاد ${esc(P.form?.ratio||'—')} · الستايل: ${esc(P.form?.style||'—')}</p><div class="row"><button class="alt" data-act="newb">أعد توليد الدليل</button><button class="alt" data-act="new">مشروع جديد</button></div></div>
 <div class="card"><h2>الشخصيات الرئيسية</h2><button class="${cp('hero')}" data-id="hero" data-text="${esc(heroPrompt(b))}" style="width:100%;margin-bottom:8px">انسخ برومبت صورة الأبطال معاً (المرجع الرئيسي)</button>${(b.main||[]).map(c=>`<details style="display:block"><summary>${esc(c.name)}</summary><p>${esc(c.desc)}</p></details>`).join('')}</div>
 <div class="card"><h2>الثانوية: انسخ برومبت الصورة المرجعية</h2><div class="chars">${(b.secondary||[]).map(c=>`<button class="${cp('s:'+c.code)}" data-id="s:${esc(c.code)}" data-text="${esc(sg+c.prompt)}"><b>${esc(c.code)}</b>${esc(c.name)}<small class="mut">${esc(c.type)}</small></button>`).join('')}</div></div>
 <div class="card"><h2>الحلقات</h2>${b.episodes.map(e=>`<div class="ep"><b>${e.n}. ${esc(e.title)}</b> <span class="mut small">${esc(e.value||'')}</span><textarea data-sum="${e.n}" rows="3">${esc(e.summary)}</textarea><div class="row"><button data-act="gen" data-n="${e.n}">${P.eps[e.n]?'افتح الحلقة':'ولّد الحلقة'}</button>${P.eps[e.n]?`<button class="alt" data-act="regen" data-n="${e.n}">أعد التوليد</button>`:''}</div></div>`).join('')}</div>`;
}
function renderEp(){
 const ep=P.eps[curEp],sg=pre();
 $('v-ep').innerHTML=`<div class="card"><button class="alt" data-act="back">‹ الحلقات</button><h2 style="margin-top:12px">الحلقة ${curEp}: ${esc(ep.title)}</h2>${ep.scenes.map(s=>`<div class="scene"><div class="num">${s.n}</div>
 <button class="${cp(curEp+':f'+s.n)}" data-id="${curEp}:f${s.n}" data-text="${esc(sg+s.first_frame_prompt)}">صورة أولى</button>
 <button class="${cp(curEp+':m'+s.n)}" data-id="${curEp}:m${s.n}" data-text="${esc(s.motion_prompt)}">تحريك M${s.n}</button>
 ${(s.refs||[]).length?`<div class="ref">المراجع: ${s.refs.map(esc).join('، ')}</div>`:''}
 <div class="sum">${esc(s.summary)}</div>
 <details><summary>عرض النصوص</summary><p>${esc(s.first_frame_prompt)}</p><p>${esc(s.motion_prompt)}</p>${s.voice?`<p dir="rtl" style="text-align:right">${esc(s.voice)}</p>`:''}</details></div>`).join('')}</div>`;
}
const opt=(k,a)=>a.map(([v,t])=>`<option value="${v}"${String(S[k])===String(v)?' selected':''}>${t}</option>`).join('');
function renderSet(){
 $('v-set').innerHTML=`<div class="card"><button class="alt" data-act="back2">‹ رجوع</button><h2 style="margin-top:12px">مفاتيح Gemini</h2>
 <label>مفتاح واحد في كل سطر</label><textarea data-set="keys" rows="5" dir="ltr" placeholder="AIza...">${esc(S.keys)}</textarea><ul class="keys" id="kl"></ul>
 <p class="mut small">الأفضل مفاتيح من حسابات أو مشاريع Google مختلفة، فالحد المجاني غالباً يُحسب على المشروع.</p></div>
 <div class="card"><h2>النموذج</h2>
 <select data-set="model">${modelOpts('model')}</select>${S.model==='__custom'?`<input data-set="modelCustom" list="ml" value="${esc(S.modelCustom)}" dir="ltr" style="margin-top:8px">`:''}<p class="mut small">${mnote('model')}</p>
 <label>نموذج احتياطي عند ازدحام الخادم (503)</label><select data-set="fallback">${modelOpts('fallback')}</select>${S.fallback==='__custom'?`<input data-set="fbCustom" list="ml" value="${esc(S.fbCustom)}" dir="ltr" style="margin-top:8px">`:''}
 <label>التفكير</label><select data-set="think">${opt('think',[['low','سريع (low) — موصى به'],['default','افتراضي (أبطأ وأعمق)']])}</select>
 <p class="mut small">⚡ سريع · 🐢 بطيء · 🆓 بلا شارة Paid في AI Studio (وحدوده المجانية قد تكون ضيقة) · 💳 مدفوع.</p>
 <datalist id="ml"></datalist><button class="alt" data-act="models" style="width:100%">اجلب النماذج المتاحة لمفتاحي</button></div>
 <div class="card"><h2>الإنتاج</h2>
 <label>مستوى الدارجة</label><select data-set="darija">${opt('darija',[['full','دارجة جزائرية كاملة'],['light','قريبة من الفصحى']])}</select>
 <label>الحوار</label><select data-set="dialogue">${opt('dialogue',[['clip','ينطقه نموذج الفيديو داخل المقطع'],['voice','تعليق صوتي يُضاف لاحقاً']])}</select>
 <label>العناصر الثانوية</label><select data-set="refs">${opt('refs',[['image','أداتي تقبل صوراً مرجعية'],['text','نص فقط (تكرار الوصف)']])}</select>
 <label>عدد المشاهد</label><input data-set="scenes" type="number" min="4" max="20" value="${S.scenes}">
 <label>مدة المقطع بالثواني</label><input data-set="secs" type="number" min="4" max="12" value="${S.secs}"></div>
 <div class="card"><h2>المشروع</h2><div class="row"><button data-act="exp">تصدير</button><button class="alt" data-act="imp">استيراد</button><button class="alt" data-act="wipe">مسح المشروع</button></div></div>`;
 keyList();
}
function keyList(){const el=$('kl');if(!el)return;const n=Date.now();el.innerHTML=keyArr().map(k=>{const w=Math.ceil(((cool[k]||0)-n)/1000);return `<li><span>${mask(k)}</span><span class="mut">${w>0?'راحة '+w+'ث':'جاهز'}</span></li>`}).join('')||'<li style="direction:rtl">لا توجد مفاتيح</li>'}
setInterval(()=>{if(cur==='set')keyList()},1000);

async function listModels(){
 const ks=keyArr();if(!ks.length)return say('أضف مفتاحاً أولاً.','err');
 lock(true);say('جارٍ جلب النماذج...','busy');
 try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key='+ks[0]);if(!r.ok)throw new Error('خطأ '+r.status+': '+(await r.text()).slice(0,150));
  const j=await r.json(),n=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
  $('ml').innerHTML=n.map(x=>`<option value="${x}">`).join('');say(`وُجد ${n.length} نموذجاً. امسح خانة النموذج واضغط عليها لاختيار واحد.`,'ok')}
 catch(e){say(e.message,'err')}lock(false)}
/* ---------- الأحداث ---------- */
async function copy(b){const t=b.dataset.text;try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
 b.classList.add('done');P.copied[b.dataset.id]=1;save();toast('تم النسخ')}
document.addEventListener('click',e=>{
 const c=e.target.closest('button[data-text]');if(c)return copy(c);
 const b=e.target.closest('[data-act]');if(!b||busyF)return;
 const n=+b.dataset.n,A={mk:()=>makeBible(),newb:()=>makeBible(P.form),new:()=>show('home'),
  gen:()=>{if(P.eps[n]){curEp=n;show('ep')}else makeEp(n)},regen:()=>makeEp(n),back:()=>show('series'),back2:()=>show(prev),
  imp:()=>$('impf').click(),models:listModels,wipe:()=>{if(confirm('حذف المشروع الحالي؟')){P=null;localStorage.removeItem('project');show('home')}},
  exp:()=>{if(!P)return say('لا يوجد مشروع.','err');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,1)],{type:'application/json'}));a.download=(P.bible.title||'project')+'.json';a.click()}};
 A[b.dataset.act]?.();
});
document.addEventListener('input',e=>{const k=e.target.dataset.set;if(!k)return;S[k]=e.target.type==='number'?+e.target.value:e.target.value;store.set('settings',S);if(k==='keys')keyList();if(['model','fallback','think'].includes(k))renderSet()});
document.addEventListener('change',e=>{const n=e.target.dataset.sum;if(n&&P){P.bible.episodes.find(x=>x.n==n).summary=e.target.value;save()}});
$('impf').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.bible?.episodes)throw 0;P=d;P.eps=P.eps||{};P.copied=P.copied||{};save();show('series');say('تم الاستيراد.','ok')}catch{say('ملف غير صالح.','err')}};

$('status').onclick=()=>say('');
show(P?'series':'home');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v='+APP_VERSION).catch(()=>{});
</script>
</body>
</html>
