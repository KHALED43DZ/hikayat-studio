<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d34">
<link rel="manifest" href="manifest.json">
<title>استوديو الحكايات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#12221d;--mut:#5d6f68;--line:#d5ddd8;--g:#0f3d34;--g2:#1c6b58;--r:#c0392b;--ok:#1e8a5a}
@media(prefers-color-scheme:dark){:root{--bg:#0d1714;--card:#15241f;--ink:#e8f0ec;--mut:#93a89f;--line:#26392f;--g:#2fa384;--g2:#3cc7a2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#0f3d34;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:19px;font-weight:800}
#ver{font-size:12px;font-weight:400;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;direction:ltr}
#gear{background:rgba(255,255,255,.14);padding:0;width:44px;font-size:20px}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:16px}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mut)}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--g);color:#fff;cursor:pointer;min-height:44px}
button:disabled{opacity:.5}
button.alt{background:transparent;color:var(--g2);border:1px solid var(--g2)}
button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.mut{color:var(--mut)}.small{font-size:12px}
.keys{list-style:none;padding:0;margin:8px 0;font-size:13px}
.keys li{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);direction:ltr}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.chars button{text-align:right;display:flex;flex-direction:column;gap:2px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.chars b{color:var(--g2)}
.chars button.done{background:var(--ok);color:#fff}
.ep{border-top:1px solid var(--line);padding:12px 0}
.ep textarea{margin:6px 0}
.scene{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pb{display:flex;gap:6px;min-width:0}.pb>button:first-child{flex:1;min-width:0}
.sq,.chars .sq{flex:0 0 44px;width:44px;padding:0;flex-direction:row;align-items:center;justify-content:center;background:transparent;color:var(--g2);border:1px solid var(--g2);font-size:20px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;color:#fff;font-size:13px;margin:2px 0 2px 4px}.chip.pl{background:#1d6fa5}.chip.sc{background:#b8561c}
.num{font-weight:800;font-size:20px;color:var(--r);text-align:center}
.ref{grid-column:2;font-size:12px;color:var(--mut)}
details{grid-column:1/3;font-size:13px;color:var(--mut)}
details p,.en{margin:6px 0;line-height:1.7;direction:ltr;text-align:left}
.sum{grid-column:1/3;font-size:13px}
#status{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:12px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;display:none;z-index:9}
#status.on{display:block}#status.err{background:var(--r);color:#fff}#status.busy::before{content:"⏳ "}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
#install{display:none;background:var(--g);color:#fff;border-radius:10px;padding:12px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
#install.on{display:flex}#install button{background:#fff;color:#0f3d34;padding:8px 14px;min-height:40px}#install .x{background:transparent;color:#fff}
.slot{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.slot b{width:28px;color:var(--r);font-size:18px}.slot span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot button{padding:6px 10px;min-height:36px}.ok{color:var(--ok)}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;width:0;background:var(--g2);transition:width .3s}
video,.mgimg{width:100%;border-radius:8px;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<header><div class="bar"><div class="brand" id="brand">استوديو الحكايات <span id="ver"></span></div><button id="gear" aria-label="الإعدادات">⚙️</button></div></header>
<main>
<div id="install"><span id="installMsg">ثبّت التطبيق على جهازك لتفتحه كأي تطبيق.</span><span><button id="installBtn">تثبيت</button><button class="x" id="installX" aria-label="إغلاق">✕</button></span></div>

<section id="v-home">
 <div class="card">
  <h2>معلومات عامة عن المسلسل</h2>
  <p class="mut small">اكتب ما تعرفه فقط، والباقي يبتكره التطبيق.</p>
  <label>اسم المسلسل (اختياري)</label><input id="f_name">
  <label>الفكرة العامة</label><textarea id="f_idea" rows="3" placeholder="مثال: أطفال يبحثون عن كنز في قرية جبلية"></textarea>
  <label>الفئة العمرية</label><select id="f_age"><option>3-5 سنوات</option><option selected>6-9 سنوات</option><option>10-14 سنة</option><option>العائلة كلها</option></select>
  <label>النوع</label><select id="f_genre"><option>مغامرة</option><option>كوميديا</option><option>تراث وحكايات شعبية</option><option>تشويق وألغاز</option><option>قيم وأخلاق</option></select>
  <label>البيئة الجزائرية</label><input id="f_place" placeholder="قرية جبلية، صحراء، مدينة قديمة...">
  <label>أبعاد الفيديو</label><select id="f_ratio"><option value="16:9">16:9 أفقي (يوتيوب)</option><option value="9:16">9:16 عمودي (ريلز وتيك توك)</option><option value="1:1">1:1 مربع</option></select>
  <label>ستايل الفيديو</label><select id="f_style"><option value="3D animated cartoon, soft cinematic lighting">كرتون ثلاثي الأبعاد</option><option value="2D hand-drawn animation, bold colors">كرتون ثنائي الأبعاد</option><option value="watercolor storybook illustration, soft textures">رسم مائي لكتاب حكايات</option><option value="photorealistic cinematic live-action look">واقعي سينمائي</option><option value="claymation stop-motion look">صلصال (ستوب موشن)</option><option value="anime style, expressive and colorful">أنمي</option><option value="traditional Algerian art style with zellige patterns and warm earthy tones">فن تراثي جزائري بزخارف الزليج</option></select>
  <input id="f_style2" placeholder="أو اكتب ستايلاً خاصاً (اختياري)" style="margin-top:8px">
  <label>عدد الحلقات</label><input id="f_eps" type="number" min="1" max="20" value="5">
  <label>القيم المراد إيصالها</label><input id="f_values" placeholder="الصدق، التعاون...">
  <label>ملاحظات أو شخصيات تريدها</label><textarea id="f_notes" rows="2"></textarea>
  <button data-act="mk" style="width:100%;margin-top:14px">أنشئ المسلسل</button>
 </div>
</section>
<section id="v-series" class="hide"></section>
<section id="v-ep" class="hide"></section>
<section id="v-set" class="hide"></section>
<section id="v-mg" class="hide"></section>
<input type="file" id="impf" accept=".json" class="hide"><input type="file" id="upf" class="hide">
</main>
<div id="status"></div><div class="toast" id="toast"></div>

<script>
const APP_VERSION='1.7.0'; /* غيّره عند كل تحديث */
const $=id=>document.getElementById(id);
$('ver').textContent='v'+APP_VERSION;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let S=Object.assign({keys:'',model:'gemini-3.8-flash',modelCustom:'',fallback:'gemini-3.5-flash-lite',fbCustom:'',think:'low',placeImg:'off',mergeH:720,introSecs:4,outroSecs:4,teaser:'on',darija:'full',dialogue:'clip',scenes:12,secs:10},store.get('settings',{}));
let P=store.get('project',null),cool=store.get('cool2',{}),cur='home',prev='home',curEp=null,busyF=false,rot=0;
const save=()=>store.set('project',P);
const norm=m=>(m||'').trim().toLowerCase().replace(/^models\//,'').replace(/\s+/g,'-');
const MODELS=[
 {id:'gemini-3.8-flash',sp:1,free:1,note:'الأذكى بين نماذج Flash، وهو الافتراضي المقترح'},
 {id:'gemini-3.5-flash-lite',sp:2,free:1,note:'الأسرع، وقد تكون الدارجة أضعف قليلاً'},
 {id:'gemini-3.1-flash-lite',sp:1,free:1,note:'سريع واقتصادي'},
 {id:'gemini-3.1-pro-preview',sp:0,free:1,note:'أقوى وأبطأ، للجودة القصوى'},
 {id:'gemini-3.6-flash',sp:1,free:0,note:'الجيل السابق من Flash'},
 {id:'gemini-3-flash-preview',sp:1,free:0,note:'قديم'},
 {id:'gemini-4-argon',sp:0,free:0,note:'للمسائل المعقدة، بطيء'},
 {id:'gemini-4-carbon',sp:0,free:0,note:'الأحدث والأقوى، وهو الأبطأ'}];
for(const [k,c] of [['model','modelCustom'],['fallback','fbCustom']]){S[k]=norm(S[k]);if(S[k]==='gemini-3.7-flash')S[k]='gemini-3.5-flash-lite';if(S[k]!=='__custom'&&!MODELS.some(m=>m.id===S[k])){S[c]=S[k];S[k]='__custom'}}
const SAFE=`قواعد السلامة (الصور تُولَّد بنموذج Nano Banana والفيديو بنموذج Gemini Omni، وكلاهما يخضع لسياسة Google للاستخدام المحظور ويرفض بسهولة، فالتزم بها في كل برومبت):
- لا عنف ولا دماء ولا إصابات ولا جثث ولا تعذيب ولا معارك. تُروى الأحداث الصعبة بالتلميح: ظلال، مسافة بعيدة، أصوات خارج الكادر، فانوس، رسالة، خريطة، علم، تعابير وجوه هادئة.
- لا أسلحة بأي شكل ولا متفجرات. تجنّب هذه الألفاظ في البرومبتات: gun, rifle, weapon, bomb, explosion, shoot, kill, blood, dead, fight, attack, torture, prison, massacre, war, soldier.
- الأطفال دائماً بأمان ومحتشمون ومع بالغين موثوقين، بلا خطر عليهم، وبلا لقطات مقرّبة لأجسادهم، وبعيداً عن أي سلاح أو عنف.
- لا أشخاص حقيقيين ولا شخصيات تاريخية أو سياسية أو مشاهير بالاسم أو بالشبه، ولا علامات تجارية ولا شعارات ولا شخصيات محمية بحقوق، ولا أسماء فنانين أو استوديوهات. الشخصية التاريخية تُصوَّر بشخصية خيالية عامة.
- لا ألفاظ نابية أو شتائم أو إساءة لدين أو عرق أو بلد في الحوار، لا بالدارجة ولا بغيرها.
- لا نصوص مكتوبة داخل الصور.
- الأحداث التاريخية الحساسة تُعرض بوقار: تُعرف الفترة بالأزياء والعمارة والإضاءة والأدوات اليومية، ويُعبَّر عن التضحية بالقيم والمشاعر لا بالمشاهد القاسية. الخصوم يظهرون ظلالاً من بعيد أو خارج الكادر.`;
const RISK=/\b(gun|rifle|weapon\w*|bomb\w*|explo\w*|blood\w*|kill\w*|shoot\w*|corpse|dead|torture|massacre|violen\w*|attack\w*|fight\w*|battle|war|soldier\w*|prison\w*|execut\w*|terror\w*|wound\w*)\b/i;
const last=a=>a[a.length-1];
const vers=(s,k)=>s[k]||(s[k]=[s.cast?{shot:s.shot,cast:s.cast,objects:s.objects,action:s.action,dialogue:s.dialogue,end:s.end}:(s.prompt||s.motion_prompt||'')]);
function normBible(b){if(!b)return b;if(!b.places){const all=b.secondary||[];b.places=all.filter(c=>c.type==='place').map(c=>({name:c.name,prompt:c.prompt}));b.secondary=all.filter(c=>c.type!=='place')}b.secondary=b.secondary||[];return b}
if(P)normBible(P.bible);
const pick=(k,c)=>S[k]==='__custom'?norm(S[c]):S[k];
const mlabel=m=>`${m.id} · ${m.sp===2?'⚡⚡ الأسرع':m.sp===1?'⚡ سريع':'🐢 بطيء'} · ${m.free?'🆓 مجاني':'💳 مدفوع'}`;
const modelOpts=k=>MODELS.map(m=>`<option value="${m.id}"${S[k]===m.id?' selected':''}>${mlabel(m)}</option>`).join('')+`<option value="__custom"${S[k]==='__custom'?' selected':''}>آخر (أكتبه)</option>`;
const mnote=k=>{const m=MODELS.find(x=>x.id===S[k]);return m?m.note+(m.free?'':' ⚠️ يحتاج حساباً مدفوعاً'):'اكتب معرّف النموذج مثل gemini-3.8-flash'};
const pre=()=>{const r=P?.form?.ratio,g=P?.bible?.style_guide;return(r?`${r} ${r==='9:16'?'vertical':r==='1:1'?'square':'horizontal'} frame. `:'')+(g?g+'. ':'')};
const heroPrompt=b=>{const m=b.main||[],n=m.length;
 return `Ultra-high-resolution 4K character reference sheet on a pure white background, horizontal 16:9 layout, maximum detail and sharpness. ${n} character${n>1?'s':''} in a single row, each shown full body from head to toe, front view, neutral standing pose, drawn in the same art style (${b.style_guide||'consistent style'}). Thin vertical divider lines separate each character from the next. Below each character, a caption with the character's name in clean readable Arabic text: ${m.map((c,i)=>`${i+1}) "${c.name}"`).join(', ')}. `+m.map((c,i)=>`Character ${i+1} (${c.name}): ${c.desc}.`).join(' ')};

/* ---------- تثبيت التطبيق ---------- */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let dp=null;
if(!standalone&&!localStorage.getItem('installDismissed')){
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').classList.add('on')});
 if(/iphone|ipad|ipod/i.test(navigator.userAgent)){$('installMsg').textContent='للتثبيت: زر المشاركة في Safari ثم «إضافة إلى الشاشة الرئيسية».';$('installBtn').style.display='none';$('install').classList.add('on')}
}
$('installBtn').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('install').classList.remove('on')};
$('installX').onclick=()=>{$('install').classList.remove('on');localStorage.setItem('installDismissed','1')};

/* ---------- واجهة عامة ---------- */
function say(m,t){const s=$('status');s.textContent=m;s.className=m?'on '+(t||''):'';if(t==='ok')setTimeout(()=>{if(s.textContent===m)s.className=''},4000)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1300)}
function lock(b){busyF=b;document.querySelectorAll('button[data-act]').forEach(x=>x.disabled=b)}
function show(v){cur=v;['home','series','ep','set','mg'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==v));
 if(v==='series')renderSeries();if(v==='ep')renderEp();if(v==='set')renderSet();if(v==='mg')renderMg();scrollTo(0,0)}
$('brand').onclick=()=>show(P?'series':'home');
$('gear').onclick=()=>{if(cur!=='set')prev=cur;show('set')};

/* ---------- مجمّع المفاتيح ---------- */
const mdl=()=>S.model.trim().toLowerCase().replace(/^models\//,'').replace(/\s+/g,'-');
const keyArr=()=>S.keys.split('\n').map(k=>k.trim()).filter(Boolean);
const mask=k=>k.length>10?k.slice(0,5)+'••••'+k.slice(-4):'••••';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gem(system,user){
 const ks=keyArr();
 if(!ks.length)throw new Error('أضف مفتاح Gemini واحداً على الأقل من الإعدادات ⚙️');
 let think=S.think!=='default',last='';
 const mk=()=>JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:Object.assign({responseMimeType:'application/json'},think?{thinkingConfig:{thinkingLevel:'low'}}:{})});
 for(let round=0;round<4;round++){
  const now=Date.now(),ready=ks.filter(k=>(cool[k]||0)<=now);
  if(!ready.length)throw new Error(last||'كل المفاتيح في فترة راحة. انتظر دقيقة أو أضف مفتاحاً.');
  const main=pick('model','modelCustom'),alt=pick('fallback','fbCustom'),fb=round>=2&&alt&&alt!==main,model=fb?alt:main;
  let over=false;
  for(let i=0;i<ready.length;i++){
   const k=ready[(rot+i)%ready.length],base=`${model} · مفتاح ${ks.indexOf(k)+1} من ${ks.length}`,t0=Date.now();
   const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),75000);
   const iv=setInterval(()=>say(`جارٍ الكتابة بـ ${base} — ${Math.round((Date.now()-t0)/1000)} ث`,'busy'),1000);
   say(`جارٍ الاتصال بـ ${base}`,'busy');
   try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:mk(),signal:ac.signal});
    if(r.ok){const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');rot++;if(t)return t;last='رد فارغ: '+(j.promptFeedback?.blockReason||j.candidates?.[0]?.finishReason||'');continue}
    const e=(await r.text()).slice(0,220);last=`خطأ ${r.status}: ${e}`;
    if(think&&r.status===400&&/think/i.test(e)){think=false;i--;continue}
    if(r.status===503){over=true;continue}
    if(r.status===404&&fb)continue;
    if(r.status===429){cool[k]=Date.now()+60000;store.set('cool2',cool);continue}
    if(r.status===403||/API key not valid|API_KEY_INVALID/.test(e)){cool[k]=Date.now()+3600000;store.set('cool2',cool);continue}
    const f=new Error(last+(r.status===404||/model/i.test(e)?'\nتحقق من اسم النموذج في الإعدادات.':''));f.fatal=1;throw f;
   }catch(e){if(e.fatal)throw e;last=e.name==='AbortError'?'انتهت مهلة الطلب (75 ثانية).':e.message;over=true}
   finally{clearTimeout(tm);clearInterval(iv)}
  }
  if(round<3&&over){const w=8*(round+1);for(let t=w;t>0;t--){say(`الخادم مشغول. إعادة المحاولة بعد ${t} ثانية (${round+2} من 4)${round>=1&&alt&&alt!==main?' بالنموذج الاحتياطي':''}`,'busy');await sleep(1000)}}
 }
 throw new Error(last+'\nالخادم مشغول، جرّب بعد قليل أو غيّر النموذج من الإعدادات.');
}
function parse(t){t=t.replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');try{return JSON.parse(t.slice(a,b+1))}catch{throw new Error('رد Gemini ليس JSON صالحاً (ربما انقطع لطوله). أعد المحاولة.')}}

/* ---------- البرومبتات ---------- */
const bibleSys=f=>`أنت كاتب ومخرج لمسلسلات جزائرية قصيرة تُنتج كفيديوهات. من المعلومات العامة التي يقدمها المستخدم ابتكر مسلسلاً أصلياً (لا تقتبس عملاً موجوداً) فيه تراث جزائري حقيقي، ومحتواه آمن ومناسب للفئة العمرية. أخرج JSON فقط بلا شرح ولا Markdown.
- main: 2-4 شخصيات رئيسية، لكل منها name بالعربية وface بالإنجليزية (شكل الرأس والوجه والعينان والأنف ولون البشرة وتسريحة الشعر ولونه والعمر الظاهر، بلا أي لباس) وbody بالإنجليزية (الطول نسبة للشخصيات الأخرى والبنية).
- places: 3-8 أماكن رئيسية في القصة، لكل منها name اسم عربي بكلمة واحدة فقط (مثل: الطاحونة، المغارة) وprompt إنجليزي وصف ثابت ودقيق للمكان بلا أشخاص: الأرضية والجدران والألوان والإضاءة، وما يوجد على اليمين واليسار والوسط والخلفية وأهم القطع. يُلصق هذا الوصف حرفياً في كل مقطع فاجعله مكتملاً.
- secondary: الشخصيات والعناصر الثانوية المتكررة فقط (ليست أماكن)، لكل منها name عربي وtype (character|object) وface وbody كما في main (للعنصر object ضع وصفه الكامل في face واترك body فارغاً).
- style_guide: جملة إنجليزية واحدة للأسلوب البصري الموحد، مبنية على الستايل المطلوب (${f.style}) ومناسبة لكادر ${f.ratio}، ولا نصوص مكتوبة داخل الصور.
- episodes: بالضبط ${f.eps} حلقة، لكل منها n وtitle وvalue (القيمة التربوية) وsummary عربي من 3-4 جمل. تتصاعد الأحداث وتنتهي بخاتمة مرضية.
${SAFE}
{"title":"","logline":"","style_guide":"","main":[{"name":"","face":"","body":""}],"places":[{"name":"","prompt":""}],"secondary":[{"name":"","type":"character","face":"","body":""}],"episodes":[{"n":1,"title":"","value":"","summary":""}]}`;

const epSys=()=>`أنت مخرج فيديو. حوّل ملخص الحلقة إلى ${S.scenes} مشهداً بالضبط، مدة كل مشهد ${S.secs} ثوانٍ، واحفظ اتساق القصة مع الحلقات السابقة. أخرج JSON فقط بلا شرح.
لدى المنتج صورة مرجعية لرؤوس الشخصيات (أمامي وجانبي) يرفعها مع كل مقطع. لذلك لا تصف الوجوه ولا أجسام الشخصيات ولا المكان، فهي ثابتة في الدليل. أنت تحدد اللباس والكاميرا والمواضع.
- wardrobe: لكل شخصية تظهر في الحلقة (name حرفياً) outfit إنجليزي كامل بألوان محددة يناسب زمن القصة، ويبقى ثابتاً طوال الحلقة.
- لكل مشهد: place (اسم المكان حرفياً من الدليل)، shot (size حجم اللقطة، angle الزاوية، move حركة الكاميرا)، cast (لكل شخصية ظاهرة: name حرفياً، pos موضعها الدقيق نسبة إلى الكادر وعناصر المكان مثل "left third of the frame, beside the stone well"، pose وقوف أو جلوس أو انحناء بتفاصيله، facing اتجاه الوجه والجسد نسبة للكاميرا مثل "three-quarter left" أو "profile right" أو "back to camera"، action حركتها خلال ${S.secs} ثوانٍ)، objects (أسماء العناصر الثانوية الظاهرة)، action (الحدث بالإنجليزية في جملتين)، dialogue، end (إنجليزي قصير: أين تنتهي كل شخصية).
- نوّع اللقطات: لا يتكرر حجم اللقطة والزاوية معاً في مشهدين متتاليين داخل المكان نفسه (وسّع، قرّب، بدّل الزاوية، لقطة من فوق كتف شخصية، لقطة جانبية...). ويبدأ كل مشهد من مواضع نهاية المشهد السابق إلا إذا تغيّر المكان أو مرّ وقت.
- ${S.dialogue==='clip'?'dialogue: حوار منطوق قصير بالدارجة بين علامتي تنصيص مع اسم المتكلم يناسب المدة.':'dialogue فارغ، وتعليق صوتي قصير بالدارجة في الحقل voice.'} الدارجة ${S.darija==='full'?'الجزائرية كاملة':'قريبة من الفصحى'} بالحروف العربية.
- لا تُظهر أي كتابة في الفيديو إطلاقاً: لا ترجمات ولا عناوين ولا لافتات ولا أسماء ولا أحرف مكتوبة.
- التكوين مناسب لكادر ${P?.form?.ratio||'16:9'}. أول مشهد يجذب الانتباه، وآخره يمهد للحلقة التالية (أو يختم المسلسل إن كانت الأخيرة).
${SAFE}
{"title":"","wardrobe":[{"name":"","outfit":""}],"scenes":[{"n":1,"summary":"سطر عربي","place":"","shot":{"size":"","angle":"","move":""},"cast":[{"name":"","pos":"","pose":"","facing":"","action":""}],"objects":[""],"action":"","dialogue":"","voice":"","end":""}]}`;

/* ---------- إنشاء الدليل والحلقات ---------- */
async function makeBible(f){
 if(!f){f={name:$('f_name').value,idea:$('f_idea').value,age:$('f_age').value,genre:$('f_genre').value,place:$('f_place').value,eps:Math.min(20,Math.max(1,+$('f_eps').value||5)),ratio:$('f_ratio').value,style:$('f_style2').value.trim()||$('f_style').value,values:$('f_values').value,notes:$('f_notes').value};
  if(!f.idea.trim()&&!f.name.trim())return say('اكتب فكرة عامة أو اسماً على الأقل.','err')}
 if(P&&!confirm('سيُستبدل المشروع الحالي. متابعة؟'))return;
 lock(true);
 try{
  const b=parse(await gem(bibleSys(f),`المعلومات العامة:\n${JSON.stringify(f,null,1)}`));
  if(!Array.isArray(b.episodes)||!b.episodes.length)throw new Error('الدليل ناقص. أعد المحاولة.');normBible(b);
  P={form:f,bible:b,eps:{},copied:{}};save();show('series');say('تم إنشاء الدليل. راجعه ثم اختر حلقة.','ok');
 }catch(e){say(e.message,'err')}
 lock(false);
}
async function makeEp(n){
 if(P.eps[n]&&!confirm('ستُستبدل الحلقة الحالية. متابعة؟'))return;
 const b=P.bible,ep=b.episodes.find(e=>e.n===n);
 const prevS=b.episodes.filter(e=>e.n<n).map(e=>`${e.n}. ${e.title}: ${e.summary}`).join('\n')||'لا يوجد';
 lock(true);
 try{
  const r=parse(await gem(epSys(),`الدليل:\n${JSON.stringify({characters:[...(b.main||[]),...(b.secondary||[])].map(c=>({name:c.name,type:c.type||'character',look:look(c)})),places:(b.places||[]).map(x=>({name:x.name,layout:last(x.pv||[x.prompt])}))})}\n\nالحلقات السابقة:\n${prevS}\n\nالحلقة المطلوبة:\n${JSON.stringify(ep)}`));
  if(!Array.isArray(r.scenes)||!r.scenes.length||!Array.isArray(r.scenes[0].cast))throw new Error('لم يُرجع Gemini مشاهد مكتملة. أعد المحاولة.');r.wardrobe=Object.fromEntries((r.wardrobe||[]).map(w=>[w.name,w.outfit]));
  P.eps[n]=r;Object.keys(P.copied).filter(k=>k.startsWith(n+':')).forEach(k=>delete P.copied[k]);
  save();curEp=n;show('ep');say(`تم: ${r.scenes.length} مشهداً`,'ok');
 }catch(e){say(e.message,'err')}
 lock(false);
}

const regenPlaceSys=()=>`أعد كتابة وصف مكان لصورة مرجعية رُفض توليدها (غالباً لقيود المحتوى). أخرج JSON فقط: {"prompt":"..."}
- نفس المكان وتخطيطه (ما على اليمين واليسار والوسط والخلفية) بصياغة أكثر تحفظاً، بلا أشخاص، وأكثر تحفظاً من كل محاولة سابقة. إنجليزي.
${SAFE}`;
const regenSceneSys=()=>`أعد كتابة بنية مقطع فيديو رُفض من نموذج توليد (غالباً لقيود المحتوى). أخرج JSON فقط: {"shot":{"size":"","angle":"","move":""},"cast":[{"name":"","pos":"","pose":"","facing":"","action":""}],"objects":[""],"action":"","dialogue":"","end":""}
- نفس المعنى والأحداث بصياغة أكثر تحفظاً، وبحجم لقطة وزاوية ومواضع مختلفة عن المحاولات السابقة، ولا تكرر أياً منها.
- مواضع الشخصيات دقيقة نسبة إلى الكادر وعناصر المكان، واتجاه الوجه أو الجسد واضح.
- لا تصف الوجوه ولا اللباس ولا المكان. الأسماء حرفياً. الحوار بالدارجة الجزائرية بين علامتي تنصيص، ومدة المقطع ${S.secs} ثوانٍ.
${SAFE}`;
async function regen(b){
 const k=b.dataset.k;lock(true);
 try{
  if(k==='cd'){
   const key=b.dataset.code,list=P.bible.cards[key];
   const r=parse(await gem(regenCardSys(),`النوع: ${key==='intro'?'مقدمة':'خاتمة'}\nالمحاولات السابقة المرفوضة:\n${list.map((x,j)=>`[${j}] ${x}`).join('\n')}`));
   if(!r.prompt)throw new Error('لم يُرجع Gemini برومبتاً. أعد المحاولة.');
   list.push(r.prompt);save();renderSeries();say(`تم: النسخة ${list.length-1}`,'ok');
  }else if(k==='pl'){
   const it=P.bible.places.find(x=>x.name===b.dataset.code),list=it.pv||(it.pv=[it.prompt]);
   const r=parse(await gem(regenPlaceSys(),`اسم المكان: ${it.name}\nرقم المحاولة: ${list.length}\nالأوصاف السابقة المرفوضة:\n${list.map((x,j)=>`[${j}] ${x}`).join('\n')}`));
   if(!r.prompt)throw new Error('لم يُرجع Gemini وصفاً. أعد المحاولة.');
   list.push(r.prompt);save();renderSeries();say(`تم: النسخة ${list.length-1}`,'ok');
  }else{
   const ep=P.eps[curEp],it=ep.scenes.find(x=>x.n==b.dataset.n),list=vers(it,'vv'),pl=(P.bible.places||[]).find(p=>p.name===it.place),pv=ep.scenes[ep.scenes.indexOf(it)-1],L=last(list),pe=pv&&typeof last(vers(pv,'vv'))==='object'?last(vers(pv,'vv')).end||'':'';
   const r=parse(await gem(regenSceneSys(),`رقم المحاولة: ${list.length}\nملخص المشهد: ${it.summary}\nالمكان: ${it.place||''} — ${pl?last(pl.pv||[pl.prompt]):''}\nالشخصيات: ${(typeof L==='object'?L.cast.map(c=>c.name):(it.main||[])).join('، ')}\nنهاية المشهد السابق: ${pe}\nالمحاولات السابقة المرفوضة:\n${list.map((x,j)=>`[${j}] ${JSON.stringify(x)}`).join('\n')}`));
   if(!Array.isArray(r.cast)||!r.cast.length)throw new Error('رد غير مكتمل. أعد المحاولة.');
   list.push(r);save();renderEp();say(`تم: المقطع ${list.length-1}`,'ok');
  }
 }catch(e){say(e.message,'err')}
 lock(false);
}
/* ---------- العرض ---------- */
const cp=id=>P.copied[id]?' done':'';
const sty=()=>P?.bible?.style_guide?P.bible.style_guide+'. ':'';
const sq=(k,n,code)=>`<button class="sq" data-act="rg" data-k="${k}" data-n="${n||''}" data-code="${esc(code||'')}" title="إعادة توليد" aria-label="إعادة توليد">↻</button>`;
const pb=(id,text,label,k,n)=>`<div class="pb"><button class="${cp(id)}" data-id="${esc(id)}" data-text="${esc(text)}">${RISK.test(text)?'⚠ ':''}${label}</button>${sq(k,n)}</div>`;
const placeText=p=>`Ultra-high-resolution 4K location reference image on a pure white background. A single image showing the same place from several camera angles, as a clean collage of 4 panels (a wide establishing shot, a different side angle, a closer detail shot, and another view of the place) separated by thin straight divider lines. The place stays identical in all panels: same architecture, colors and lighting. No people. Below the collage, one single word in clean readable Arabic text: "${p.name}". Same art style (${P.bible.style_guide||'consistent style'}), maximum detail and sharpness. ${last(p.pv||[p.prompt])}`;
const placeBtn=p=>{const v=(p.pv||[p.prompt]).length-1,id=`pl:${p.name}:${v}`,t=placeText(p);return `<div class="pb" style="margin-bottom:8px"><button class="${cp(id)}" data-id="${esc(id)}" data-text="${esc(t)}">${RISK.test(t)?'⚠ ':''}صورة مكان: ${esc(p.name)}${v?' · '+v:''}</button>${sq('pl','',p.name)}</div>`};
const refBtn=(id,t,label)=>`<button class="${cp(id)}" data-id="${id}" data-text="${esc(t)}" style="width:100%;margin-bottom:8px">${label}</button>`;
const charList=b=>[...(b.main||[]),...(b.secondary||[])];
const look=c=>c?[c.face||c.desc,c.body].filter(Boolean).join('; '):'';
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
const headsList=b=>[...(b.main||[]),...(b.secondary||[]).filter(c=>c.type!=='object')];
const headsPrompt=(g,b)=>{const n=g.length,lay=n<=3?`row of ${n} card${n>1?'s':''}`:`grid of ${Math.ceil(n/3)} rows with up to 3 cards per row`;
 return `Ultra-high-resolution 4K character head reference sheet on a pure white background, horizontal 16:9 canvas. A ${lay}, ${n} card${n>1?'s':''} in total, separated by thin straight divider lines. Each card shows ONE character's head and neck only (no body, no clothing): a front-view portrait and a side-profile portrait side by side, neutral calm expression, plain white backdrop. Below each card, the character's name in clean readable Arabic text: ${g.map((c,i)=>`${i+1}) "${c.name}"`).join(', ')}. Same art style (${b.style_guide||'consistent style'}), maximum detail and sharpness. `+g.map((c,i)=>`Card ${i+1} (${c.name}): ${c.face||c.desc}.`).join(' ')};
const NOTEXT=' Do not show any text, subtitles, captions, watermarks, signs or written letters anywhere in the video, and do not show the name captions from the reference images.';
function clipText(s,ep){
 const v=last(vers(s,'vv')),B=P.bible;
 if(typeof v==='string')return pre()+'Use the attached reference images to keep characters and places consistent. '+v+NOTEXT;
 const pl=(B.places||[]).find(p=>p.name===s.place),w=ep.wardrobe||{},cd=n=>charList(B).find(c=>c.name===n);
 return [pre()+'Use the attached character head reference sheet (front and side portraits) only for faces and identity; clothing, setting and positions are specified below.',
  'Camera: '+[v.shot?.size,v.shot?.angle,v.shot?.move].filter(Boolean).join(', ')+'.',
  s.place?`Setting "${s.place}": ${pl?last(pl.pv||[pl.prompt]):''}${S.placeImg==='on'?' (matches the attached reference image of this place)':''}`:'',
  'Characters:\n'+(v.cast||[]).map(c=>`- "${c.name}": ${look(cd(c.name))}.${w[c.name]?' Wearing: '+w[c.name]+'.':''} Position: ${c.pos||''}. ${c.pose||''}, facing ${c.facing||''}. ${c.action||''}`).join('\n'),
  (v.objects||[]).filter(Boolean).length?'Objects: '+v.objects.filter(Boolean).map(n=>`"${n}": ${look(cd(n))}`).join('; '):'',
  'Action: '+(v.action||''),
  v.dialogue?'Spoken dialogue (Algerian Arabic dialect): '+v.dialogue:''].filter(Boolean).join('\n')+'\n'+NOTEXT.trim()}

 $('v-series').innerHTML=`<div class="card"><h2>${esc(b.title)}</h2><p class="mut">${esc(b.logline)}</p><p class="mut small">الأبعاد ${esc(P.form?.ratio||'—')} · الستايل: ${esc(P.form?.style||'—')}</p><div class="row"><button class="alt" data-act="newb">أعد توليد الدليل</button><button class="alt" data-act="new">مشروع جديد</button></div></div>
 <div class="card"><h2>الصور المرجعية (ارفعها مع كل مقطع)</h2><p class="mut small">صورة رؤوس الشخصيات فقط (أمامي وجانبي) بأعلى جودة. اللباس والمكان والمواضع تُكتب في برومبت كل مقطع.</p>
 ${hs.map((g,i)=>refBtn('heads'+i,headsPrompt(g,b),'صورة رؤوس الشخصيات'+(hs.length>1?` (${i+1} من ${hs.length})`:'')+' — '+g.map(c=>esc(c.name)).join('، '))).join('')||'<p class="mut small">لا توجد شخصيات. أعد توليد الدليل.</p>'}
 ${S.placeImg==='on'?(b.places||[]).map(placeBtn).join(''):''}</div>
 <div class="card"><h2>المقدمة والخاتمة (مرة واحدة لكل المسلسل)</h2>${cardsHtml(b)}</div>
 <div class="card"><h2>الأوصاف الثابتة</h2>${charList(b).map(c=>`<details style="display:block"><summary>${esc(c.name)}</summary><p>${esc(look(c))}</p></details>`).join('')}${(b.places||[]).map(p=>`<details style="display:block"><summary>📍 ${esc(p.name)}</summary><p>${esc(last(p.pv||[p.prompt]))}</p></details>`).join('')}</div>
 <div class="card"><h2>الحلقات</h2>${b.episodes.map(e=>`<div class="ep"><b>${e.n}. ${esc(e.title)}</b> <span class="mut small">${esc(e.value||'')}</span><textarea data-sum="${e.n}" rows="3">${esc(e.summary)}</textarea><div class="row"><button data-act="gen" data-n="${e.n}">${P.eps[e.n]?'افتح الحلقة':'ولّد الحلقة'}</button>${P.eps[e.n]?`<button class="alt" data-act="regen" data-n="${e.n}">أعد التوليد</button>`:''}</div></div>`).join('')}</div>`;
}
function renderEp(){
 const ep=P.eps[curEp],w=ep.wardrobe||{},names=Object.keys(w);
 $('v-ep').innerHTML=`<div class="card"><div class="row"><button class="alt" data-act="back">‹ الحلقات</button><button data-act="mg">رفع المقاطع ودمجها ›</button></div><h2 style="margin-top:12px">الحلقة ${curEp}: ${esc(ep.title)}</h2>${names.length?`<details style="display:block"><summary>لباس الحلقة (تعديله يحدّث كل المقاطع)</summary>${names.map(n=>`<label>${esc(n)}</label><input data-ward="${esc(n)}" value="${esc(w[n])}" dir="ltr">`).join('')}</details>`:''}${ep.scenes.map(s=>{
  const a=vers(s,'vv'),v=a.length-1,L=a[v],t=clipText(s,ep),nm=typeof L==='object'?(L.cast||[]).map(c=>c.name):(s.main||[]);
  const info=(s.place?`<span class="chip pl">المكان: ${esc(s.place)}</span>`:'')+nm.filter(Boolean).map(c=>`<span class="chip sc">${esc(c)}</span>`).join('');
  return `<div class="scene"><div class="num">${s.n}</div>${pb(curEp+':v'+s.n+':'+v+':'+JSON.stringify(w).length,t,'مقطع '+v,'vv',s.n)}${info?`<div class="ref">${info}</div>`:''}<div class="sum">${esc(s.summary)}</div><details><summary>عرض النص</summary><p>${esc(t).replace(/\n/g,'<br>')}</p>${s.voice?`<p dir="rtl" style="text-align:right">${esc(s.voice)}</p>`:''}</details></div>`}).join('')}</div>`;
}

/* ---------- تخزين الملفات (IndexedDB) ---------- */
const mem=new Map();
const idb=(()=>{
 if(typeof indexedDB==='undefined')return{get:async k=>mem.get(k),put:async(k,v)=>{mem.set(k,v)},del:async k=>{mem.delete(k)}};
 let d;const open=()=>d||(d=new Promise((res,rej)=>{const r=indexedDB.open('hikayat',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=async(m,f)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('f',m),q=f(t.objectStore('f'));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)})};
 return{get:k=>tx('readonly',x=>x.get(k)),put:(k,v)=>tx('readwrite',x=>x.put(v,k)),del:k=>tx('readwrite',x=>x.delete(k))}})();
const meta=b=>new Promise(res=>{const u=URL.createObjectURL(b);
 if(b.type.startsWith('image/')){const i=new Image();i.onload=()=>{res({w:i.naturalWidth,h:i.naturalHeight,dur:0});URL.revokeObjectURL(u)};i.onerror=()=>res({w:0,h:0,dur:0});i.src=u}
 else{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{res({w:v.videoWidth,h:v.videoHeight,dur:v.duration});URL.revokeObjectURL(u)};v.onerror=()=>res({w:0,h:0,dur:0});v.src=u}});
const rkey=n=>n==='intro'||n==='outro'?n:`clip:${curEp}:${n}`;
const saveRec=async(k,f)=>{const m=await meta(f);await idb.put(k,{blob:f,name:f.name,size:f.size,type:f.type,...m})};

/* ---------- بطاقات العنوان (canvas) ---------- */
async function cardPng(blob,lines,W,H){
 const bm=await createImageBitmap(blob),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const r=Math.max(W/bm.width,H/bm.height);x.drawImage(bm,(W-bm.width*r)/2,(H-bm.height*r)/2,bm.width*r,bm.height*r);
 const g=x.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H*.55);
 try{await document.fonts.load('800 40px Tajawal')}catch{}
 x.direction='rtl';x.textAlign='center';x.textBaseline='top';x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=H*.015;
 let y=H*.07;
 for(const l of lines){const sz=Math.round(Math.min(W,H)*l.k*1.6);x.font=`800 ${sz}px Tajawal,sans-serif`;
  let row='';const rows=[];for(const wd of String(l.t).split(' ')){const t=row?row+' '+wd:wd;if(x.measureText(t).width>W*.86&&row){rows.push(row);row=wd}else row=t}rows.push(row);
  for(const rw of rows){x.fillText(rw,W/2,y);y+=sz*1.25}y+=sz*.25}
 return new Promise(res=>c.toBlob(res,'image/png'))}
const cardLines=which=>{const nx=P.bible.episodes.find(e=>e.n===curEp+1),ep=P.eps[curEp];
 if(which==='intro')return[{t:P.bible.title,k:.05},{t:'الحلقة '+curEp,k:.09},{t:ep.title,k:.06}];
 return S.teaser==='on'&&nx?[{t:'في الحلقة القادمة',k:.05},{t:nx.title,k:.08}]:[{t:P.bible.title,k:.07},{t:'شكراً لمشاهدتكم',k:.05}]};

/* ---------- الدمج بـ FFmpeg.wasm ---------- */
const loadScript=src=>new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('تعذّر تحميل '+src));document.head.appendChild(t)});
const blobURL=async(u,t)=>{const r=await fetch(u);if(!r.ok)throw new Error('تعذّر تحميل '+u);return URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:t}))};
async function getFF(){
 if(FF)return FF;
 say('جارٍ تحميل أداة الدمج (نحو 30 ميغابايت في أول مرة فقط)...','busy');
 let local=false;try{local=(await fetch('ffmpeg/ffmpeg-core.wasm',{method:'HEAD'})).ok}catch{}
 const CDN='https://cdn.jsdelivr.net/npm/@ffmpeg/',A=local?'ffmpeg':CDN+'ffmpeg@0.12.10/dist/umd',C=local?'ffmpeg':CDN+'core@0.12.6/dist/umd';
 try{
  await loadScript(A+'/ffmpeg.js');
  const f=new FFmpegWASM.FFmpeg(),cfg={coreURL:await blobURL(C+'/ffmpeg-core.js','text/javascript'),wasmURL:await blobURL(C+'/ffmpeg-core.wasm','application/wasm')};
  if(!local)cfg.classWorkerURL=await blobURL(A+'/814.ffmpeg.js','text/javascript');
  f.on('progress',e=>onProg(e.progress));f.on('log',e=>logBuf.push(e.message));
  await f.load(cfg);FF=f;return f;
 }catch(e){throw new Error('تعذّر تشغيل أداة الدمج: '+e.message+'\nجرّب وضع الملفات المحلية (راجع ffmpeg/README.txt) أو نزّل بطاقتي المقدمة والخاتمة وادمج المقاطع في CapCut.')}
}
async function doMerge(){
 const ep=P.eps[curEp],{w:W,h:H}=dims(),segs=[];
 lock(true);bar(0);
 try{
  const clips=[];for(const x of ep.scenes){const r=await idb.get(rkey(x.n));if(r)clips.push(r)}
  if(!clips.length)throw new Error('ارفع مقطعاً واحداً على الأقل.');
  const I=await idb.get('intro'),O=await idb.get('outro'),plan=[];
  if(I)plan.push({r:I,card:'intro'});clips.forEach(r=>plan.push({r}));if(O)plan.push({r:O,card:'outro'});
  const f=await getFF();
  const run=async a=>{const c=await f.exec(a);if(c!==0)throw new Error('فشلت معالجة أحد المقاطع (رمز '+c+'). جرّب دقة أقل من الإعدادات.')};
  for(let i=0;i<plan.length;i++){
   const it=plan[i],out=`s${i}.mp4`,base=i/plan.length;
   onProg=p=>bar(base+Math.min(1,Math.max(0,p||0))/plan.length);
   say(`معالجة ${i+1} من ${plan.length} ... لا تغلق الصفحة`,'busy');
   if(it.r.type.startsWith('image/')){
    const secs=+(it.card==='intro'?S.introSecs:S.outroSecs)||4,png=await cardPng(it.r.blob,cardLines(it.card),W,H);
    await f.writeFile('c.png',new Uint8Array(await png.arrayBuffer()));
    await run(['-loop','1','-t',String(secs),'-i','c.png','-f','lavfi','-t',String(secs),'-i','anullsrc=r=48000:cl=stereo','-vf',`format=yuv420p,fade=t=in:st=0:d=0.6,fade=t=out:st=${secs-0.6}:d=0.6`,'-r','30','-c:v','libx264','-preset','ultrafast','-crf','24','-c:a','aac','-ar','48000','-ac','2','-shortest',out]);
    await f.deleteFile('c.png');
   }else{
    await f.writeFile('in.mp4',new Uint8Array(await it.r.blob.arrayBuffer()));
    logBuf.length=0;try{await f.exec(['-hide_banner','-i','in.mp4'])}catch{}
    const au=logBuf.some(m=>/Stream #\d+:\d+.*Audio/.test(m)),vf=`scale=${W}:${H}:force_original_aspect_ratio=decrease,pad=${W}:${H}:(ow-iw)/2:(oh-ih)/2,format=yuv420p`;
    const a=au?['-i','in.mp4','-vf',vf,'-map','0:v:0','-map','0:a:0']:['-i','in.mp4','-f','lavfi','-i','anullsrc=r=48000:cl=stereo','-vf',vf,'-map','0:v:0','-map','1:a:0','-shortest'];
    await run([...a,'-r','30','-c:v','libx264','-preset','ultrafast','-crf','24','-c:a','aac','-ar','48000','-ac','2',out]);
    await f.deleteFile('in.mp4');
   }
   segs.push(out);
  }
  say('جارٍ تجميع الحلقة...','busy');onProg=()=>{};
  await f.writeFile('list.txt',segs.map(x=>`file '${x}'`).join('\n'));
  await run(['-f','concat','-safe','0','-i','list.txt','-c','copy','-movflags','+faststart','final.mp4']);
  const data=await f.readFile('final.mp4');
  for(const x of segs)await f.deleteFile(x);await f.deleteFile('list.txt');await f.deleteFile('final.mp4');
  const name=`${P.bible.title}-الحلقة-${curEp}.mp4`;
  lastFile=new File([data],name,{type:'video/mp4'});const u=URL.createObjectURL(lastFile);
  bar(1);$('mgOut').innerHTML=`<video controls playsinline src="${u}"></video><div class="row" style="margin-top:10px"><a href="${u}" download="${esc(name)}" style="text-decoration:none"><button style="width:100%">تنزيل الحلقة</button></a><button class="alt" data-act="share">مشاركة</button></div>`;
  say(`تم دمج الحلقة (${(lastFile.size/1048576).toFixed(1)} MB)`,'ok');
 }catch(e){say(e.message,'err')}
 lock(false);
}
async function shareOut(){if(!lastFile)return;try{await navigator.share({files:[lastFile],title:lastFile.name})}catch{say('المشاركة غير متاحة هنا، استخدم زر التنزيل.','err')}}

$('status').onclick=()=>say('');
show(P?'series':'home');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v='+APP_VERSION).catch(()=>{});
</script>
